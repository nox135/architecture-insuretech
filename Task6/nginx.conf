http {
    # Настройка upstream для балансировки нагрузки
    upstream backend_servers {
        server backend1.example.com;
        server backend2.example.com;
        server backend3.example.com;
    }

    # Rate Limiting: не более 10 запросов в минуту с одного IP.
    # Зона partner_limit размером 10m хранит состояние ~160 000 IP-адресов.
    limit_req_zone $binary_remote_addr zone=partner_limit:10m rate=10r/m;

    # При превышении лимита возвращать 429 Too Many Requests.
    limit_req_status 429;

    server {
        listen 80;

        location / {
            # nodelay - запросы сверх лимита отклоняются сразу, без очереди.
            limit_req zone=partner_limit nodelay;

            proxy_pass http://backend_servers;
        }
    }
}